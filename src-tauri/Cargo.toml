[package]
name = "sideshell"
version = "0.4.0"
description = "SideShell - a modern cross-platform terminal with left-side project/shell tree"
authors = ["SideShell"]
edition = "2021"

[lib]
name = "sideshell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "io-util", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"
anyhow = "1"
parking_lot = "0.12"
once_cell = "1"
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled"] }
time = { version = "0.3", features = ["parsing"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true


